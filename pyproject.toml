[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofind"
version = "0.1.0"
description = "Local search over files and screenshots. Nothing leaves the machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
ocr-windows = [
  "winrt-runtime",
  "winrt-Windows.Foundation",
  "winrt-Windows.Foundation.Collections",
  "winrt-Windows.Globalization",
  "winrt-Windows.Storage",
  "winrt-Windows.Storage.Streams",
  "winrt-Windows.Graphics.Imaging",
  "winrt-Windows.Media.Ocr",
]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.15"]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
autofind = "core.cli:main"

[tool.setuptools]
packages = ["core", "core.extract", "core.embed", "core.ocr"]
