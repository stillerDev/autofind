name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests / windows / py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Base deps plus the optional extractors the suite exercises.
          # OCR bindings (winrt) and the desktop stack (pywebview) are left out
          # on purpose: the OCR tests need a language pack that CI does not have,
          # and no test creates a native window.
          python -m pip install -e ".[dev,pdf,docx,onnx,watch]"
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: smoke / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q core tests run.py

      - name: Import smoke
        run: |
          python - <<'PY'
          import core.query
          import core.embed
          import core.search
          import core.store
          import core.indexer
          import core.personal
          import core.vectors
          print("imports ok")
          PY
