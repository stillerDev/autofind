<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoFind — локальный поиск по файлам и скриншотам</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Painted before any script runs, so the window never shows a white flash or
     an empty grid while the vector pack is being faulted in. The greeting is
     filled in by app.js from the languages this machine can actually read. -->
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-inner">
    <div class="boot-hello" id="boot-hello">Hello</div>
    <div class="boot-lang" id="boot-lang">English</div>
    <div class="boot-track"><span class="boot-bar" id="boot-bar"></span></div>
    <div class="boot-stage" id="boot-stage">запускаю</div>
  </div>
</div>
<div class="app">
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <a class="wordmark" href="/" title="AutoFind">
          <span class="mark"></span>
          <span>AutoFind</span>
        </a>
        <div class="find">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="q" autocomplete="off" spellcheck="false" placeholder="поиск"
                 aria-label="Поиск по файлам и скриншотам">
          <button class="clear" id="clear" type="button" aria-label="Очистить">×</button>
        </div>
        <!-- The window has no title bar, so this is the only way out of it.
             Sits last, in the corner where Windows puts its own close button. -->
        <div class="win-controls" id="win-controls" aria-label="Окно">
          <button type="button" data-win="hide"
                  title="Скрыть в трей (Ctrl+Alt+Space). Выход — в меню трея.">✕</button>
        </div>
      </div>

      <nav class="menu" aria-label="Тип файлов">
        <button class="chip active" data-kind="">Всё</button>
        <button class="chip" data-kind="docs">Документы</button>
        <button class="chip" data-kind="code">Код</button>
        <button class="chip" data-kind="pdf">PDF</button>
        <button class="chip" data-kind="docx">DOCX</button>
        <button class="chip" data-kind="image">Скриншоты</button>
      </nav>
    </div>
  </header>

  <div class="tools">
    <span class="pill" id="status-pill" title="Состояние индекса">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">проверяю индекс…</span>
    </span>
    <label class="field">
      <span>папка</span>
      <input id="folder" placeholder="любая" autocomplete="off">
    </label>
    <label class="field">
      <span>с</span>
      <input id="since" type="date">
    </label>
    <label class="field">
      <span>сортировка</span>
      <select id="sort" aria-label="Сортировка результатов">
        <option value="best">по совпадению</option>
        <option value="newest">новые</option>
        <option value="oldest">старые</option>
        <option value="largest">крупные</option>
        <option value="name">по имени</option>
      </select>
    </label>
    <div class="meta-line" id="meta"></div>
  </div>

  <main>
    <div id="content"></div>
  </main>

  <aside>
    <div class="panel">
      <h3>Индекс</h3>
      <div class="stat-grid">
        <div class="stat"><span>файлов</span><b id="s-files">—</b></div>
        <div class="stat"><span>фрагментов</span><b id="s-chunks">—</b></div>
        <div class="stat"><span>скриншотов</span><b id="s-images">—</b></div>
        <div class="stat"><span>с OCR</span><b id="s-ocr">—</b></div>
        <div class="stat"><span>размер</span><b id="s-size">—</b></div>
      </div>
    </div>

    <div class="panel">
      <h3>Индексировать</h3>
      <textarea class="paths" id="roots" rows="3" spellcheck="false"
                placeholder="По одной папке в строке"></textarea>
      <label class="stat-row" style="cursor:pointer">
        <span>удалять пропавшие</span>
        <input type="checkbox" id="prune">
      </label>
      <div class="btn-row">
        <button class="btn primary" id="index-btn">Индексировать</button>
        <button class="btn" id="watch-btn">Следить</button>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="status-line">
        <span class="progress-label" id="progress-label">готов к работе</span>
        <span class="progress-label" id="watch-label">слежение выключено</span>
      </div>
    </div>

    <div class="panel">
      <h3>Приватность</h3>
      <div class="stat-row">
        <span>фильтр <b id="p-enabled">—</b> · приватного <b id="p-count">—</b></span>
        <button class="btn mini" id="purge-btn">убрать</button>
      </div>
    </div>

    <div class="panel">
      <h3>Движки</h3>
      <div class="engines" id="engines">—</div>
    </div>

    <div class="side-foot">
      <span><kbd>/</kbd> фокус</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> выбор</span>
      <span><kbd>space</kbd> просмотр</span>
      <span><kbd>enter</kbd> открыть</span>
      <span class="only-app"><kbd>ctrl</kbd><kbd>alt</kbd><kbd>space</kbd> окно</span>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="preview">
  <div class="modal-card preview-card">
    <div class="modal-head">
      <h3>Просмотр</h3>
      <button class="close" id="preview-close">закрыть</button>
    </div>
    <div id="preview-body"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-title">Похожие скриншоты</h3>
      <button class="close" id="modal-close">закрыть</button>
    </div>
    <div class="grid" id="modal-grid"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
