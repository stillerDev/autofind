<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoFind — минимальное меню</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/minimal.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <path d="M15.5 15.5 21 21"></path>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Искать везде" aria-label="Поиск по файлам">
      <button id="clear" class="clear" type="button" hidden aria-label="Очистить поиск">×</button>
    </div>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Светлая тема"
            aria-pressed="false" title="Светлая тема">
      <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M22 12h-2M4 12H2M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4M19.1 19.1l-1.4-1.4M6.3 6.3 4.9 4.9"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
      </svg>
    </button>
    <div class="menu-anchor">
      <button id="gear" class="icon-btn" type="button" aria-label="Меню"
              aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"></path>
        </svg>
      </button>
      <div id="menu" class="menu" role="menu" aria-label="Меню" hidden>
        <button type="button" role="menuitem" data-action="refresh">Обновить</button>
        <button type="button" role="menuitem" data-action="folder">Папка индекса</button>
        <button type="button" role="menuitem" data-action="settings">Настройки</button>
        <button type="button" role="menuitem" data-action="classic">Классический вид</button>
      </div>
    </div>
  </header>

  <main class="content" id="content">
    <div class="section-head">
      <span id="section-title">Недавние</span>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid" role="listbox" aria-label="Файлы"></div>
    <p class="empty" id="empty" hidden>Ничего не найдено</p>
  </main>

  <footer class="statusbar">
    <div class="status-left">
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Индекс загружается…</span>
      <button type="button" class="text-btn" id="refresh">Обновить</button>
    </div>
    <div class="hotkeys" aria-label="Горячие клавиши">
      <span><kbd>Space</kbd> Открыть</span>
      <span><kbd>P</kbd> Предпросмотр</span>
      <span><kbd>F</kbd> В папке</span>
      <span><kbd>I</kbd> Детали</span>
    </div>
  </footer>
</div>

<aside class="details" id="details" hidden aria-label="Детали файла">
  <div class="details-head">
    <span>Детали</span>
    <button type="button" class="icon-btn" id="details-close" aria-label="Закрыть детали">×</button>
  </div>
  <div class="details-body" id="details-body"></div>
</aside>

<script src="/minimal.js"></script>
</body>
</html>
